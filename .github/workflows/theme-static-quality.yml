name: Theme Static Quality

on:
  pull_request:
    paths:
      - 'assets/**/*.js'
      - 'config/**/*.json'
      - 'locales/**/*.json'
      - 'sections/**/*.json'
      - 'templates/**/*.json'
      - '.github/workflows/theme-static-quality.yml'
  push:
    branches:
      - edits-here-2
    paths:
      - 'assets/**/*.js'
      - 'config/**/*.json'
      - 'locales/**/*.json'
      - 'sections/**/*.json'
      - 'templates/**/*.json'
      - '.github/workflows/theme-static-quality.yml'

permissions:
  contents: read

concurrency:
  group: theme-static-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find assets -type f -name '*.js' -print0 | sort -z)
          printf 'Checking %s JavaScript assets\n' "${#files[@]}"
          for file in "${files[@]}"; do
            node --input-type=module --check < "$file"
          done

  json:
    name: Shopify JSON syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Shopify JSON files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          roots = [Path('config'), Path('locales'), Path('sections'), Path('templates')]
          files = sorted(path for root in roots if root.exists() for path in root.rglob('*.json'))
          errors = []
          shopify_header = re.compile(r'^\s*/\*.*?\*/\s*', re.DOTALL)

          for path in files:
              try:
                  text = path.read_text(encoding='utf-8-sig')
                  # Shopify theme-editor JSON commonly starts with one generated
                  # block-comment warning. Strip only that leading header; the
                  # remaining payload must be strict JSON.
                  text = shopify_header.sub('', text, count=1)
                  json.loads(text)
              except Exception as exc:
                  errors.append(f'{path}: {exc}')

          print(f'Checked {len(files)} Shopify JSON files')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY
