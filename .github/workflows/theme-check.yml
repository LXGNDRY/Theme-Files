name: Theme Check

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'blocks/**'
      - 'config/**'
      - 'layout/**'
      - 'locales/**'
      - 'sections/**'
      - 'snippets/**'
      - 'templates/**'
      - '.theme-check.yml'
      - '.github/workflows/theme-check.yml'
  push:
    branches:
      - edits-here
      - edits-here-2

permissions:
  contents: read
  checks: write

concurrency:
  group: theme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          token: ${{ github.token }}
          flags: '--fail-level error'
