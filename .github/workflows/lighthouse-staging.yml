name: Lighthouse Staging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lighthouse-staging.yml'
  push:
    branches:
      - edits-here-2
    paths:
      - 'assets/**'
      - 'blocks/**'
      - 'config/**'
      - 'layout/**'
      - 'locales/**'
      - 'sections/**'
      - 'snippets/**'
      - 'templates/**'
      - '.github/workflows/lighthouse-staging.yml'

permissions:
  contents: read

concurrency:
  group: lighthouse-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Median Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_THEME_ID: '151147413657'
      STORE_ORIGIN: 'https://legendary-branding.com'
      LH_VERSION: '13.4.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Verify Chrome
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version

      - name: Install pinned Lighthouse
        shell: bash
        run: npm install --global "lighthouse@${LH_VERSION}"

      - name: Run three mobile audits per commerce surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-results

          declare -A URLS=(
            [home]="${STORE_ORIGIN}/?preview_theme_id=${PREVIEW_THEME_ID}"
            [collection]="${STORE_ORIGIN}/collections/shirts-tops?preview_theme_id=${PREVIEW_THEME_ID}"
            [product]="${STORE_ORIGIN}/products/unisex-boxy-t-shirt-280gsm?preview_theme_id=${PREVIEW_THEME_ID}"
            [cart]="${STORE_ORIGIN}/cart?preview_theme_id=${PREVIEW_THEME_ID}"
          )

          for surface in home collection product cart; do
            for run in 1 2 3; do
              echo "Auditing ${surface}, run ${run}/3"
              lighthouse "${URLS[$surface]}" \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
                --form-factor=mobile \
                --screenEmulation.mobile=true \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json \
                --output-path="lighthouse-results/${surface}-${run}.json" \
                --quiet
            done
          done

      - name: Build median scorecard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          surfaces = ['home', 'collection', 'product', 'cart']
          fields = {
              'performance': ('categories', 'performance', 'score'),
              'accessibility': ('categories', 'accessibility', 'score'),
              'best_practices': ('categories', 'best-practices', 'score'),
              'seo': ('categories', 'seo', 'score'),
              'lcp_ms': ('audits', 'largest-contentful-paint', 'numericValue'),
              'fcp_ms': ('audits', 'first-contentful-paint', 'numericValue'),
              'tbt_ms': ('audits', 'total-blocking-time', 'numericValue'),
              'cls': ('audits', 'cumulative-layout-shift', 'numericValue'),
              'speed_index_ms': ('audits', 'speed-index', 'numericValue'),
          }

          def get(data, path):
              value = data
              for key in path:
                  value = value[key]
              return value

          rows = []
          for surface in surfaces:
              reports = [
                  json.loads(Path(f'lighthouse-results/{surface}-{run}.json').read_text())
                  for run in (1, 2, 3)
              ]
              row = {'surface': surface}
              for name, path in fields.items():
                  values = [get(report, path) for report in reports]
                  median = statistics.median(values)
                  if name in {'performance', 'accessibility', 'best_practices', 'seo'}:
                      median = round(median * 100)
                  elif name == 'cls':
                      median = round(median, 3)
                  else:
                      median = round(median)
                  row[name] = median
              rows.append(row)

          lines = [
              '# Staging Lighthouse Median Scorecard',
              '',
              'Three mobile Lighthouse runs per surface; values below are medians.',
              '',
              '| Surface | Perf | A11y | Best | SEO | LCP ms | FCP ms | TBT ms | CLS | Speed Index ms |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for row in rows:
              lines.append(
                  f"| {row['surface']} | {row['performance']} | {row['accessibility']} | "
                  f"{row['best_practices']} | {row['seo']} | {row['lcp_ms']} | "
                  f"{row['fcp_ms']} | {row['tbt_ms']} | {row['cls']} | {row['speed_index_ms']} |"
              )

          lines += [
              '',
              '## Programme targets',
              '',
              '- Lighthouse mobile performance: aspirational >= 90',
              '- LCP: <= 2500 ms',
              '- TBT lab target: <= 200 ms',
              '- CLS: <= 0.10',
              '- Accessibility: no regression from baseline',
              '- SEO: no regression from baseline',
          ]

          text = '\n'.join(lines) + '\n'
          Path('lighthouse-results/SUMMARY.md').write_text(text)
          print(text)

          github_summary = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          github_summary.write_text(text)
          PY

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-staging-${{ github.sha }}
          path: lighthouse-results/
          retention-days: 30
